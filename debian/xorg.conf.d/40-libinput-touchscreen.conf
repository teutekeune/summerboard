# Touchscreen via libinput (generic catch-all + optional product match).
# setup.sh may rewrite MatchProduct after probing /proc/bus/input/devices.

Section "InputClass"
    Identifier "Summerboard touchscreen (product)"
    MatchProduct "SYNA7813"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "SendCoreEvents" "on"
    Option "CalibrationMatrix" "1 0 0 0 1 0 0 0 1"
EndSection

Section "InputClass"
    Identifier "Summerboard touchscreen catchall"
    MatchIsTouchscreen "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
EndSection
